<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalhes do Local</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="isLoading" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Carregando detalhes...</p>
  </div>

  <div *ngIf="!isLoading && localDetalhes">
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ localDetalhes.name }}</ion-card-title>
        <ion-card-subtitle>{{ localDetalhes.formatted_address }}</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        
        <img *ngIf="photoUrl" 
             [src]="photoUrl" 
             alt="Foto do local" 
             class="header-image" />

        <div class="info-content">
          <div class="reviews-section" *ngIf="localDetalhes.reviews && localDetalhes.reviews.length > 0">
            <h3>Avaliações:</h3>
            <ion-list>
              <ion-item *ngFor="let review of localDetalhes.reviews">
                <ion-label text-wrap>
                  <strong>{{ review.author_name }}</strong> <span>(Nota: {{ review.rating }}/5)</span>
                  <p>{{ review.text }}</p>
                </ion-label>
              </ion-item>
            </ion-list>
          </div>

          <p>ID do Local: {{ localDetalhes.place_id }}</p>
        </div>
      </ion-card-content>
    </ion-card>
  </div>

  <div *ngIf="!isLoading && !localDetalhes">
    <ion-item lines="none">
      <ion-label color="danger">Não foi possível carregar os detalhes.</ion-label>
    </ion-item>
  </div>
</ion-content>
